<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MycoMixer App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
</head>
<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide-react@latest/dist/lucide-react.umd.js"></script>
    <script>
        const { useState, useEffect } = React;
        const { X, Droplet, Plus } = lucideReact;

        const MycoMixer = () => {
            const [ingredients, setIngredients] = useState({});
            const [ingredientDatabase, setIngredientDatabase] = useState([]);
            const [clickedBottle, setClickedBottle] = useState(null);

            useEffect(() => {
                const loadIngredients = async () => {
                    try {
                        // Simulate fetching data
                        const demoBottles = [
                            { id: 'agar', name: 'MEA Agar', color: '#00ff00', increment: 5, unit: 'g', type: 'jar', category: 'base' },
                            { id: 'water', name: 'Distilled Water', color: '#00ffff', increment: 50, unit: 'ml', type: 'bottle-tall', category: 'liquid' },
                            // Add more ingredients as necessary...
                        ];
                        
                        setIngredientDatabase(demoBottles);
                        const initialState = {};
                        demoBottles.forEach(b => {
                            initialState[b.id] = 0;
                        });
                        setIngredients(initialState);
                    } catch (error) {
                        console.error('Error loading ingredients:', error);
                    }
                };
                
                loadIngredients();
            }, []);

            const addIngredient = (bottleId, increment) => {
                setIngredients(prev => ({
                    ...prev,
                    [bottleId]: (prev[bottleId] || 0) + increment
                }));
                setClickedBottle(bottleId);
                setTimeout(() => setClickedBottle(null), 300);
            };

            const totalVolume = Object.values(ingredients).reduce((a, b) => a + b, 0);

            return (
                <div className="relative p-4">
                    <h1 className="text-2xl font-bold">MycoMixer</h1>
                    <div className="grid grid-cols-4 gap-4 mt-4">
                        {ingredientDatabase.map(bottle => (
                            <button 
                                key={bottle.id} 
                                onClick={() => addIngredient(bottle.id, bottle.increment)} 
                                className="relative border p-2 rounded"
                                style={{ backgroundColor: clickedBottle === bottle.id ? '#f0f0f0' : 'white' }}
                            >
                                <div style={{ backgroundColor: bottle.color }}>
                                    {bottle.name}
                                </div>
                                <div>{ingredients[bottle.id]} {bottle.unit}</div>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => <MycoMixer />;

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
