[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Language = ["en"]}

[[redirects]]
  from = "/*"
  to = "/nl/index.html"
  status = 200
  conditions = {Language = ["nl"]}

[[redirects]]
  from = "/*"
  to = "/ar/index.html"
  status = 200
  conditions = {Language = ["ar"]}
