<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MycoLab Research Library - Technical Literacy</title>
    <style>
        /* --- NEON AESTHETIC STYLES --- */
        
        :root {
            --color-neon-green: #00FF7F;
            --color-neon-cyan: #00FFFF;
            --color-neon-yellow: #FFFF00;
            --color-neon-red: #FF0040;
            --color-background-dark: #000000;
        }

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background-color: var(--color-background-dark);
            margin: 0;
            padding: 0;
        }

       .resource-container {
            background-color: var(--color-background-dark);
            color: var(--color-neon-green);
            padding: 30px;
            border: 3px solid var(--color-neon-red);
            max-width: 1400px;
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.5);
            min-height: 80vh;
        }

        h1 {
            color: var(--color-neon-yellow);
            text-align: center;
            border-bottom: 2px solid var(--color-neon-cyan);
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-shadow: 0 0 5px var(--color-neon-yellow);
        }

        /* --- TAB NAVIGATION STYLES --- */

       .tabs-list {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 2px solid var(--color-neon-green);
            margin-bottom: 20px;
            justify-content: flex-start;
        }

       .tab-button {
            background-color: transparent;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            color: #E0FFE0;
            font-size: 1em;
            transition: all 0.2s;
            text-transform: uppercase;
        }

       .tab-button:hover {
            color: var(--color-neon-yellow);
            text-shadow: 0 0 3px var(--color-neon-yellow);
        }

       .tab-button.active {
            color: var(--color-neon-cyan);
            border-bottom: 3px solid var(--color-neon-cyan);
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 255, 255, 0.5);
        }
        
        /* --- CONTENT CARD STYLES --- */

       .tab-content {
            display: none;
        }

       .tab-content.active {
            display: block;
        }

       .resource-section h2 {
            color: var(--color-neon-green);
            border-left: 4px solid var(--color-neon-green);
            padding-left: 10px;
            margin: 20px 0 15px;
            text-transform: none;
        }

       .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

       .link-card {
            border: 2px solid var(--color-neon-green);
            padding: 15px;
            text-decoration: none;
            color: #E0FFE0;
            display: block;
            position: relative;
            background-color: rgba(0, 0, 0, 0.7);
            transition: all 0.2s ease-in-out;
            min-height: 80px;
            cursor: pointer;
            box-shadow: 0 0 5px var(--color-neon-green);
        }

       .link-card:hover {
            border-color: var(--color-neon-yellow);
            box-shadow: 0 0 15px var(--color-neon-yellow);
            z-index: 10;
        }

       .link-title {
            font-weight: bold;
            font-size: 1.1em;
            color: var(--color-neon-cyan);
        }
        
        /* --- SYNOPSIS (HOVER) STYLES --- */
        
       .synopsis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.98);
            border: 2px solid var(--color-neon-yellow);
            box-sizing: border-box;
            color: #FFFFFF;
            overflow: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

       .link-card:hover.synopsis {
            opacity: 1;
            pointer-events: all;
        }

       .synopsis-text {
            font-size: 0.9em;
            line-height: 1.4;
            margin-bottom: 10px;
        }

       .synopsis-citations {
            font-size: 0.8em;
            color: var(--color-neon-red);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="resource-container">
    <h1>MycoLab Research Library: Technical and Educational Resources</h1>
    
    <div id="resources-output">
        <div id="tabs-list" class="tabs-list">
            </div>
        <div id="tabs-content">
            </div>
        <p id="loading-message">Loading MycoLab Resources...</p>
    </div>
</div>

<script>
    // --- 1. EMBEDDED DATA STRUCTURE ---
    const resourceData ="

        },
        {
            "section": "II. Aseptic Technique and Improvised Equipment (SAB/LFH)",
            "links":"

                {

                    "synopsis": "A Laminar Flow Hood (LFH) provides a continuous stream of HEPA-filtered air (ISO 5/Class 100), eliminating airborne contaminants. This drastically increases success rates and productivity compared to a Still Air Box.",
                    "citations": "[5, 6, 7]"
                },
                {

                    "citations": "[8, 9]"

        },
        {

                    "citations": "[25, 26, 27]"

        },
        {
            "section": "V. Culture Acquisition, Tracking, and Education",
            "links":"
                },
                {
                    "title": "Cultivare: Free, Open-Source Strain Tracking Software",
                    "url": "https://github.com/cultivare/cultivare",
                    "synopsis": "Open-source cultivation software designed for managing strains, tracking lineage (genealogical trees), and generating barcode labels. Essential for implementing QA and reproducible protocols in the Mycolab.",
                    "citations": "[31]"
                },
                {
                    "title": "MycoManager: Professional Lab Management System for Culture Genealogy",
                    "url": "https://liquidfungi.com/pages/interested-in-using-mycomanager-at-your-laboratory",
                    "synopsis": "A management system for tracking genetics, samples, and complete genealogical relationships between cultures to maintain pristine QA records and trace the source of any issues.",
                    "citations": "[32]"
                },
                {
                    "title": "Fungi Foundation: Developing Free Mycological Curricula",
                    "url": "https://www.ffungi.org/en/education",
                    "synopsis": "Organizations are actively developing free, multi-lingual mycological curricula aligned with international standards (NGSS) to increase global education about the importance of fungi, providing a base for the Mycolab's educational outreach.",
                    "citations": "[33]"
                }
            ]
        }
    ];


    // --- 2. EMBEDDED JAVASCRIPT LOGIC ---
    
    document.addEventListener('DOMContentLoaded', () => {
        const tabsList = document.getElementById('tabs-list');
        const tabsContent = document.getElementById('tabs-content');
        const loadingMessage = document.getElementById('loading-message');
        
        if (!tabsList ||!tabsContent) return;

        if (resourceData.length === 0) {
            loadingMessage.textContent = "Error: Resource data is empty or unavailable.";
            return;
        }
        
        loadingMessage.style.display = 'none';

        let firstTabId = null;

        /**
         * Core Tab Management Function: Controls which tab content is visible.
         * @param {string} tabId - The unique ID of the tab to display.
         */
        function openTab(tabId) {
            // Deactivate all
            document.querySelectorAll('.tab-content').forEach(panel => {
                panel.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });

            // Activate selected
            const selectedPanel = document.getElementById(tabId);
            if (selectedPanel) {
                selectedPanel.classList.add('active');
            }
            const selectedButton = document.querySelector(`[data-tab-id="${tabId}"]`);
            if (selectedButton) {
                selectedButton.classList.add('active');
            }
        }

        // --- Data Rendering Loop ---
        resourceData.forEach((section, index) => {
            
            // Generate unique, clean ID from section name
            const tabId = 'tab-' + section.section.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            if (index === 0) {
                firstTabId = tabId;
            }

            // 1. Create Tab Button
            const button = document.createElement('button');
            button.className = 'tab-button';
            button.textContent = section.section.split('. ')[1] |

| section.section; // Use only the title after the number
            button.setAttribute('data-tab-id', tabId);
            
            button.addEventListener('click', () => {
                openTab(tabId);
            });
            tabsList.appendChild(button);

            // 2. Create Content Panel
            const contentDiv = document.createElement('div');
            contentDiv.id = tabId;
            contentDiv.className = 'tab-content';
            
            // Inner Section Title (H2)
            const sectionTitle = document.createElement('h2');
            sectionTitle.textContent = section.section;
            contentDiv.appendChild(sectionTitle);

            // 3. Create Grid Container for Links
            const linksGrid = document.createElement('div');
            linksGrid.className = 'links-grid';

            section.links.forEach(link => {
                // 4. Create Link Card (<a> element)
                const card = document.createElement('a');
                card.href = link.url;
                card.className = 'link-card';
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                // Static Title
                const staticTitle = document.createElement('div');
                staticTitle.className = 'link-title';
                staticTitle.textContent = link.title;
                card.appendChild(staticTitle);
                
                // Synopsis Overlay (Appears on Hover)
                const synopsisDiv = document.createElement('div');
                synopsisDiv.className = 'synopsis';
                
                const synopsisText = document.createElement('p');
                synopsisText.className = 'synopsis-text';
                synopsisText.textContent = link.synopsis;
                synopsisDiv.appendChild(synopsisText);

                const citations = document.createElement('p');
                citations.className = 'synopsis-citations';
                citations.textContent = `Source IDs: ${link.citations |

| 'N/A'}`;
                synopsisDiv.appendChild(citations);

                card.appendChild(synopsisDiv);
                linksGrid.appendChild(card);
            });

            contentDiv.appendChild(linksGrid);
            tabsContent.appendChild(contentDiv);
        });

        // 5. Initialize the first tab as active
        if (firstTabId) {
            openTab(firstTabId);
        }
    });
</script>
</body>
</html>
