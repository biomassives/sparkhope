<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulation Lab Bench MVP</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f0f0; color: #222; }
  h2 { margin-top: 30px; }
  #ingredient-shelf { 
    display: flex; 
    gap: 10px; 
    padding: 10px; 
    background: #ddd; 
    border-radius: 5px; 
    overflow-x: auto; 
  }
  .bottle { 
    padding: 10px; 
    background: #fff; 
    border: 1px solid #aaa; 
    border-radius: 5px; 
    cursor: grab; 
    width: 130px; 
    text-align: center; 
    flex: 0 0 auto; 
  }
  .section { 
    margin-top: 20px; 
    padding: 10px; 
    background: #eee; 
    border: 1px solid #bbb; 
    border-radius: 5px; 
    min-height: 160px; 
  }
  .ingredient-list { margin-top: 10px; }
  .ingredient-row { 
    padding: 3px 6px; 
    border-bottom: 1px solid #ccc; 
    background: #fafafa;
    border-radius: 3px;
    margin-bottom: 2px;
  }
  .nutrient-display { margin-top: 10px; font-weight: bold; background: #fff; padding: 4px 8px; border-radius: 4px; }
</style>
</head>
<body>

<h1>Formulation Lab Bench MVP</h1>

<h2>Ingredient Shelf</h2>
<div id="ingredient-shelf"></div>

<h2>Formulation Sections</h2>
<div class="section" id="section-1">
  <div><strong>Section 1 – Base Mix</strong></div>
  <div class="ingredient-list"></div>
  <div class="nutrient-display">C: 0 | N: 0 | P: 0 | K: 0</div>
</div>

<div class="section" id="section-2">
  <div><strong>Section 2 – Additives</strong></div>
  <div class="ingredient-list"></div>
  <div class="nutrient-display">C: 0 | N: 0 | P: 0 | K: 0</div>
</div>

<div class="section" id="section-3">
  <div><strong>Section 3 – Enrichment</strong></div>
  <div class="ingredient-list"></div>
  <div class="nutrient-display">C: 0 | N: 0 | P: 0 | K: 0</div>
</div>

<script>
// 🌾 Ingredient Data – 25+ entries
const ingredients = [
  {id:"ingredient-1", name:"Wild Bird Seed", category:"grain", nutrients:{carbon:50, nitrogen:2.5, phosphorus:0.5, potassium:1.0}},
  {id:"ingredient-2", name:"Rye Grain", category:"grain", nutrients:{carbon:52, nitrogen:1.9, phosphorus:0.4, potassium:0.9}},
  {id:"ingredient-3", name:"Millet", category:"grain", nutrients:{carbon:49, nitrogen:2.2, phosphorus:0.5, potassium:1.0}},
  {id:"ingredient-4", name:"Brown Rice", category:"grain", nutrients:{carbon:55, nitrogen:2.0, phosphorus:0.4, potassium:0.8}},
  {id:"ingredient-5", name:"Soy Hulls", category:"protein", nutrients:{carbon:45, nitrogen:3.5, phosphorus:0.6, potassium:1.1}},
  {id:"ingredient-6", name:"Wheat Bran", category:"bran", nutrients:{carbon:48, nitrogen:3.0, phosphorus:1.0, potassium:1.3}},
  {id:"ingredient-7", name:"Cottonseed Meal", category:"protein", nutrients:{carbon:42, nitrogen:6.5, phosphorus:1.2, potassium:1.6}},
  {id:"ingredient-8", name:"Cornmeal", category:"grain", nutrients:{carbon:58, nitrogen:1.5, phosphorus:0.4, potassium:0.7}},
  {id:"ingredient-9", name:"Vermiculite", category:"additive", nutrients:{carbon:0, nitrogen:0, phosphorus:0, potassium:0}},
  {id:"ingredient-10", name:"Coco Coir", category:"fiber", nutrients:{carbon:53, nitrogen:0.8, phosphorus:0.3, potassium:1.8}},
  {id:"ingredient-11", name:"Peat Moss", category:"fiber", nutrients:{carbon:58, nitrogen:0.7, phosphorus:0.2, potassium:0.6}},
  {id:"ingredient-12", name:"Perlite", category:"additive", nutrients:{carbon:0, nitrogen:0, phosphorus:0, potassium:0}},
  {id:"ingredient-13", name:"Gypsum (CaSO₄)", category:"mineral", nutrients:{carbon:0, nitrogen:0, phosphorus:0.3, potassium:0}},
  {id:"ingredient-14", name:"Gypsum + Lime Blend", category:"mineral", nutrients:{carbon:0, nitrogen:0, phosphorus:0.4, potassium:0}},
  {id:"ingredient-15", name:"Crushed Oyster Shell", category:"mineral", nutrients:{carbon:0, nitrogen:0, phosphorus:0.2, potassium:0}},
  {id:"ingredient-16", name:"Compost (Aged Manure)", category:"organic", nutrients:{carbon:40, nitrogen:2.8, phosphorus:1.0, potassium:1.2}},
  {id:"ingredient-17", name:"Compost (Vegetative)", category:"organic", nutrients:{carbon:35, nitrogen:2.0, phosphorus:0.8, potassium:1.5}},
  {id:"ingredient-18", name:"Spent Mushroom Substrate", category:"recycled", nutrients:{carbon:30, nitrogen:1.5, phosphorus:0.7, potassium:1.0}},
  {id:"ingredient-19", name:"Enriched Compost + Coir Mix", category:"blend", nutrients:{carbon:43, nitrogen:2.0, phosphorus:0.8, potassium:1.6}},
  {id:"ingredient-20", name:"Biochar (Fine)", category:"additive", nutrients:{carbon:75, nitrogen:0.1, phosphorus:0.1, potassium:0.2}},
  {id:"ingredient-21", name:"Alfalfa Meal", category:"organic", nutrients:{carbon:44, nitrogen:3.0, phosphorus:0.7, potassium:2.0}},
  {id:"ingredient-22", name:"Fish Bone Meal", category:"organic", nutrients:{carbon:35, nitrogen:5.0, phosphorus:3.5, potassium:0.4}},
  {id:"ingredient-23", name:"Feather Meal", category:"protein", nutrients:{carbon:40, nitrogen:12.0, phosphorus:0.5, potassium:0.3}},
  {id:"ingredient-24", name:"Kelp Meal", category:"additive", nutrients:{carbon:32, nitrogen:1.5, phosphorus:0.8, potassium:2.5}},
  {id:"ingredient-25", name:"MycoMineral Mix", category:"blend", nutrients:{carbon:0, nitrogen:0.1, phosphorus:0.4, potassium:0.8}},
  {id:"ingredient-26", name:"Rice Hulls", category:"fiber", nutrients:{carbon:52, nitrogen:0.3, phosphorus:0.2, potassium:1.0}}
];

// 🧴 Render Shelf
function renderShelf() {
  const shelf = document.getElementById('ingredient-shelf');
  shelf.innerHTML = '';
  ingredients.forEach(ing => {
    const bottle = document.createElement('div');
    bottle.className = 'bottle';
    bottle.draggable = true;
    bottle.dataset.id = ing.id;
    bottle.innerHTML = `<div><strong>${ing.name}</strong></div><div style="font-size:0.9em;color:#666;">${ing.category}</div>`;
    bottle.addEventListener('dragstart', e => e.dataTransfer.setData('ingredient-id', ing.id));
    shelf.appendChild(bottle);
  });
}

// ⚗️ Setup Dropzones
function setupDropzones() {
  document.querySelectorAll('.section').forEach(section => {
    section.addEventListener('dragover', e => e.preventDefault());
    section.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('ingredient-id');
      const ingredient = ingredients.find(i => i.id === id);
      if (ingredient) addIngredientToSection(section, ingredient);
    });
  });
}

// ➕ Add ingredient to section
function addIngredientToSection(section, ingredient) {
  const list = section.querySelector('.ingredient-list');
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  row.textContent = ingredient.name;
  list.appendChild(row);
  updateSectionNutrients(section);
}

// 🧮 Update nutrient totals
function updateSectionNutrients(section) {
  const rows = section.querySelectorAll('.ingredient-row');
  const totals = {carbon:0, nitrogen:0, phosphorus:0, potassium:0};
  rows.forEach(row => {
    const ing = ingredients.find(i => i.name === row.textContent);
    if (ing && ing.nutrients) {
      for (let key in ing.nutrients) totals[key] += ing.nutrients[key];
    }
  });
  const d = section.querySelector('.nutrient-display');
  d.textContent = `C: ${totals.carbon.toFixed(1)} | N: ${totals.nitrogen.toFixed(2)} | P: ${totals.phosphorus.toFixed(2)} | K: ${totals.potassium.toFixed(2)}`;
}

document.addEventListener('DOMContentLoaded', () => {
  renderShelf();
  setupDropzones();
});
</script>

</body>
</html>
